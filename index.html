<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access · CricDeCode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: #334155; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.12); }
        .forgot-container { text-align: right; margin-top: -10px; margin-bottom: 20px; }
        .forgot-link { font-size: 0.85rem; color: #475569; text-decoration: none; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
        .btn-main {
            width: 100%;
            background-color: #64748b;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-main:hover { background-color: #475569; }
        .footer-action { text-align: center; margin-top: 24px; font-size: 0.9rem; color: #334155; }
        .footer-action a { color: #0f172a; font-weight: 500; text-decoration: none; cursor: pointer; }
        .footer-action a:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        .alert { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1 id="form-title">Sign in</h1>
        <div id="form-subtitle" class="subtitle">Enter your credentials to access your account.</div>

        <div id="alert-box" class="hidden alert"></div>

        <!-- FORM CONTAINER -->
        <form id="auth-form" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group" id="password-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="forgot-container" id="forgot-wrapper">
                <a onclick="switchToView('forgot')" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" id="submit-btn" class="btn-main">Sign in</button>
        </form>

        <!-- FOOTER NAVIGATION SWITCHERS -->
        <div class="footer-action" id="footer-signup">
            Need an account? <a onclick="switchToView('signup')">Sign up</a>
        </div>
        <div class="footer-action hidden" id="footer-signin">
            Remembered your password? <a onclick="switchToView('signin')">Sign in</a>
        </div>
    </div>

    <script>
        let currentMode = 'signin'; // options: 'signin', 'signup', 'forgot'

        function switchToView(mode) {
            currentMode = mode;
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const passGroup = document.getElementById('password-group');
            const forgotWrapper = document.getElementById('forgot-wrapper');
            const footerSignup = document.getElementById('footer-signup');
            const footerSignin = document.getElementById('footer-signin');
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('hidden');

            if (mode === 'signin') {
                title.innerText = 'Sign in';
                subtitle.innerText = 'Enter your credentials to access your account.';
                submitBtn.innerText = 'Sign in';
                passGroup.classList.remove('hidden');
                forgotWrapper.classList.remove('hidden');
                footerSignup.classList.remove('hidden');
                footerSignin.classList.add('hidden');
            } else if (mode === 'signup') {
                title.innerText = 'Create an account';
                subtitle.innerText = 'Sign up to request access to the telemetry portal.';
                submitBtn.innerText = 'Create Account';
                passGroup.classList.remove('hidden');
                forgotWrapper.classList.add('hidden');
                footerSignup.classList.add('hidden');
                footerSignin.classList.remove('hidden');
            } else if (mode === 'forgot') {
                title.innerText = 'Reset password';
                subtitle.innerText = 'Enter your email and we will send you a recovery link.';
                submitBtn.innerText = 'Send Reset Link';
                passGroup.classList.add('hidden');
                forgotWrapper.classList.add('hidden');
                footerSignup.classList.add('hidden');
                footerSignin.classList.remove('hidden');
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.remove('hidden');
            
            if (currentMode === 'signin') {
                alertBox.className = 'alert';
                alertBox.innerText = `Connecting to authentication backend for ${email}... (Plug in Supabase/Firebase SDK here)`;
            } else if (currentMode === 'signup') {
                alertBox.className = 'alert success';
                alertBox.innerText = `Account created for ${email}! Pending admin approval.`;
            } else if (currentMode === 'forgot') {
                alertBox.className = 'alert success';
                alertBox.innerText = `Password reset instructions sent to ${email}.`;
            }
        }
    </script>
</body>
</html>
