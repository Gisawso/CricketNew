<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · CricDeCode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: #334155; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.12); }
        .btn-signin {
            width: 100%;
            background-color: #64748b;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-signin:hover { background-color: #475569; }
        .signup-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: #334155; }
        .signup-footer a { color: #0f172a; font-weight: 500; text-decoration: cursor; cursor: pointer; }
        .hidden { display: none !important; }
        .alert-box { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .success-box { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-container" class="auth-card">
        <h1 id="form-title">Sign in</h1>
        <div id="form-subtitle" class="subtitle">Enter your credentials to access the analyzer.</div>

        <div id="status-message" class="hidden alert-box"></div>
        
        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" id="submit-btn" class="btn-signin">Sign in</button>
        </form>

        <div class="signup-footer" id="toggle-footer">
            Need an account? <a onclick="toggleMode()">Sign up</a>
        </div>
    </div>

    <!-- MAIN ANALYZER DASHBOARD (Hidden until approved & logged in) -->
    <div id="app-container" class="auth-card hidden" style="max-width: 800px;">
        <h1 id="welcome-header">Cricket Analyzer Dashboard</h1>
        <div class="subtitle">You have successfully cleared the access gate.</div>
        
        <div style="background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <h3>📊 Live Telemetry Active</h3>
            <p style="margin-top: 8px; color: #475569;">Your pitch metrics and frame sampling tools are ready.</p>
        </div>

        <button class="btn-signin" style="background-color: #ef4444;" onclick="logout()">Sign Out</button>
    </div>

    <script>
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').innerText = isSignUp ? 'Request Access' : 'Sign in';
            document.getElementById('form-subtitle').innerText = isSignUp ? 'Create an account to send an approval request to the owner.' : 'Enter your credentials to access the analyzer.';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Request Access' : 'Sign in';
            document.getElementById('toggle-footer').innerHTML = isSignUp ? 
                'Already have an account? <a onclick="toggleMode()">Sign in</a>' : 
                'Need an account? <a onclick="toggleMode()">Sign up</a>';
            document.getElementById('status-message').classList.add('hidden');
        }

        function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const msgBox = document.getElementById('status-message');

            if (isSignUp) {
                // Mock registration logic (In production, write to Supabase/Firebase with status: 'pending')
                msgBox.className = 'alert-box success-box';
                msgBox.innerText = '✅ Access request sent! Please wait for the owner to approve your account.';
                msgBox.classList.remove('hidden');
            } else {
                // Mock login check (Owner or approved user simulation)
                if (email === "owner@cricket.com") {
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('welcome-header').innerText = "👑 Owner Admin Portal";
                } else {
                    // Check if user is approved
                    msgBox.className = 'alert-box';
                    msgBox.innerText = '⏳ Your account is pending owner approval.';
                    msgBox.classList.remove('hidden');
                }
            }
        }

        function logout() {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('auth-form').reset();
            document.getElementById('status-message').classList.add('hidden');
        }
    </script>
</body>
</html>
