<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · CricDeCode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #0f172a;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        input:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.12);
        }
        .forgot-container {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        .forgot-link {
            font-size: 0.85rem;
            color: #475569;
            text-decoration: none;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-signin {
            width: 100%;
            background-color: #64748b;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-signin:hover {
            background-color: #475569;
        }
        .signup-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #334155;
        }
        .signup-footer a {
            color: #0f172a;
            font-weight: 500;
            text-decoration: none;
        }
        .signup-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>Sign in</h1>
        <div class="subtitle">Authentication is handled by Convex.</div>
        
        <form onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="">
            </div>

            <div class="forgot-container">
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">Sign in</button>
        </form>

        <div class="signup-footer">
            Need an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            // Add your login handling logic here
            alert(`Signing in as: ${email}`);
        }
    </script>

</body>
</html>
