<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Analyzer · Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }
        .dashboard-card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 8px; }
        .subtitle { font-size: 1rem; color: #64748b; margin-bottom: 30px; }
        .content-box {
            background: #f1f5f9;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn-main {
            background-color: #0ea5e9;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-main:hover { background-color: #0284c7; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>🏏 Cricket Telemetry Portal</h1>
        <p class="subtitle">Live analytics and performance tracking dashboard.</p>
        
        <div class="content-box">
            <p>Welcome! Your application is now open and fully accessible. You can start adding your cricket analytics components, match stats, or data visualizers right here.</p>
        </div>

        <button class="btn-main" onclick="alert('Portal is active and ready for your features!')">Explore Telemetry Data</button>
    </div>

</body>
</html>
